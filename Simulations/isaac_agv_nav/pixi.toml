[workspace]
channels = ["conda-forge"]
name = "isaac-agv-nav"
platforms = ["linux-64"]
version = "0.1.0"
description = "Symmetry-exploiting DRL for sample-efficient AGV path planning and sim-to-real transfer (Isaac Sim)"

[system-requirements]
libc = { family = "glibc", version = "2.35" }

[pypi-options]
index-url = "https://pypi.org/simple"
extra-index-urls = ["https://pypi.nvidia.com"]
index-strategy = "unsafe-best-match"
# flatdict (isaaclab -> ... -> flatdict) has a legacy setup.py that imports
# pkg_resources without declaring setuptools as a build dependency, which
# fails under isolated builds. setuptools is provided as a conda dep below.
no-build-isolation = ["flatdict"]

# ---- core: shared python + tooling ----
[feature.core.dependencies]
python = "3.11.*"
pip = "*"
# pinned <81: setuptools 81+ dropped pkg_resources, which some legacy
# packages (e.g. flatdict, pulled in by isaaclab) still import at build time
setuptools = "<81"

[feature.core.pypi-dependencies]
omegaconf = "*"
hydra-core = "*"
matplotlib = "*"
pandas = "*"
tensorboard = "*"

[feature.core.activation.env]
PROJECT_ROOT = "${PIXI_PROJECT_ROOT}"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

# ---- isaac: Isaac Sim itself ----
[feature.isaac.dependencies]
packaging = "==23.0"
numpy = "==1.26.0"

[feature.isaac.pypi-dependencies]
isaacsim = { version = "==5.0.0", extras = ["all", "extscache"] }

[feature.isaac.activation.env]
OMNI_KIT_ACCEPT_EULA = "YES"

[feature.isaac.tasks]
isaacsim = "isaacsim"

# ---- lab: Isaac Lab — the actual GPU-vectorized RL task/training framework
# built on top of Isaac Sim. Pinned to 2.2.0 because it's the isaaclab release
# that targets isaacsim==5.0.0.* (the version already installed above) —
# newer isaaclab (2.3.x) wants isaacsim 5.1.0.*, which would mean re-downloading
# the ~20GB Isaac Sim install for no benefit here.
[feature.lab.pypi-dependencies]
isaaclab = { version = "==2.2.0", extras = ["isaacsim", "sb3"] }

# ---- rl: training stack (three arms: baseline / sym-augmented / equivariant) ----
[feature.rl.pypi-dependencies]
gymnasium = "*"
stable-baselines3 = { version = "*", extras = ["extra"] }
torch = "*"
wandb = "*"
# escnn (equivariant policy networks, arm 3) installed separately post-env —
# its lie_learn dependency has a legacy setup.py build that needs numpy
# already present and fails under isolated PEP517 builds (pixi/uv). See
# scripts/install_escnn.sh.

[feature.rl.tasks]
train-baseline = "python scripts/train.py arm=baseline"
train-augmented = "python scripts/train.py arm=symmetric_augmentation"
train-equivariant = "python scripts/train.py arm=equivariant_policy"
eval = "python scripts/evaluate.py"

[environments]
default = ["core", "isaac", "lab", "rl"]
rl-only = ["core", "rl"]
